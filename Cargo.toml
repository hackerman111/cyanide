[package]
name = "cyanide"
version = "0.1.0"
edition = "2024"
description = "Linux virtual camera and virtual microphone utility with GTK4 comparison UI"

[dependencies]
async-channel = "2"
gst-plugin-gtk4 = { version = "0.15", features = ["wayland", "dmabuf", "gtk_v4_14"] }
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-audio = { version = "0.25", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
toml = "1"
